[project]
name = "timetrack"
version = "0.1.0"
description = "Time tracking automation with pluggable backends"
readme = "README.md"
authors = [{ name = "Bjørn Kristian Punsvik", email = "bk.punsvik@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "httpx>=0.27.0",
    "python-dateutil>=2.8.0",
    "holidays>=0.40",
    "tzdata>=2024.0; platform_system == 'Windows'",
]

[project.scripts]
timetrack = "timetrack.cli:app"

[dependency-groups]
dev = ["pytest>=7.4.0", "ruff>=0.1.0", "ty>=0.0.14"]

[tool.ruff]
line-length = 100
target-version = "py310"
fix = true

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
    "C4", # flake8-comprehensions
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["timetrack"]

[tool.ty]
# ty configuration
# For more options, see: https://docs.astral.sh/ty/configuration/

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"
